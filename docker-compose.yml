services:
  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:8-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  web:
    build:
      context: .
      dockerfile: Dockerfile

    command:
      python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy


  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile

    command:
      celery -A config worker --loglevel=info

    volumes:
      - .:/app

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy


  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile

    command:
      celery -A config beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler

    volumes:
      - .:/app

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data: